[project]
name = "moodle-homework-assignment"
version = "0.4.5"
description = "Consulta tareas pendientes de Moodle con Playwright."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fpdf2>=2.9,<3",
    "mcp>=2.3,<3",
    "pillow>=13,<14",
    "playwright>=1.65,<2",
    "pydantic>=2.14,<3",
    "pypdf>=7.1,<8",
    "python-docx>=1.2,<2",
    "python-dotenv>=1.2,<2",
    "rich>=15,<16",
    "sentry-sdk>=2.75,<3",
    "tomlkit>=0.15,<0.16",
]

[project.scripts]
mcp-moodle = "moodle_tasks.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moodle_tasks"]
