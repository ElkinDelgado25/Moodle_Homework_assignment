[project]
name = "moodle-homework-assignment"
version = "0.5.1"
description = "Consulta tareas pendientes de Moodle con Playwright."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fpdf2>=2.9,<3",
    "mcp>=2.3,<3",
    "pillow>=13,<14",
    "playwright>=1.65,<2",
    "pydantic>=2.14,<3",
    "pypdf>=7.1,<8",
    "python-docx>=1.2,<2",
    "python-dotenv>=1.2,<2",
    "rich>=15,<16",
    "sentry-sdk>=2.75,<3",
    "tomlkit>=0.15,<0.16",
]

[project.scripts]
mcp-moodle = "moodle_tasks.cli:main"

[dependency-groups]
dev = ["ruff>=0.17.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moodle_tasks"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Reglas de errores y de corrección segura. No se activa el orden de imports para no
# reescribir el estilo de todo el repositorio en la misma auditoría.
select = ["E4", "E7", "E9", "F", "B", "UP", "RUF100"]
