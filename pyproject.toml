[project]
name = "moodle-homework-assignment"
version = "0.1.0"
description = "Consulta tareas pendientes de Moodle con Playwright."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2,<3",
    "playwright>=1.51.0",
    "python-dotenv>=1.0.1",
    "rich>=13.9",
    "tomlkit>=0.13",
]

[project.scripts]
mcp-moodle = "moodle_tasks.cli:main"
moodle-tasks = "moodle_tasks.main:main"
moodle-mcp = "moodle_tasks.server:main"
moodle-setup = "moodle_tasks.setup:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moodle_tasks"]
