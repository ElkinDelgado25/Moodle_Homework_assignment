name: Build y pruebas multiplataforma

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: "1"

jobs:
  unit:
    name: Pruebas en Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Instalar dependencias
        run: uv sync --locked --python ${{ matrix.python }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Preparar Chromium
        run: uv run playwright install chromium
      - name: Ejecutar la suite de pruebas
        # En paralelo y con la salida capturada: el registro solo muestra las pruebas que fallan.
        run: uv run pytest -n auto

  tests:
    name: Ubuntu 24.04 (Debian)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Instalar dependencias
        run: uv sync --locked --python 3.13
      - name: Revisar el código con Ruff
        run: uv run ruff check src tests scripts
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Preparar Chromium y bibliotecas de Ubuntu
        run: uv run playwright install --with-deps chromium
      - name: Construir paquete
        run: uv build --wheel
      - name: Instalar el paquete y probar CLI, Chromium y MCP
        run: uv run python scripts/ci_verify_install.py

  windows:
    name: Windows Server 2025 (x64)
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      UV_PYTHON_ARCH: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Instalar dependencias
        run: uv sync --locked --python 3.13
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Preparar Chromium en Windows
        run: uv run playwright install chromium
      - name: Construir paquete
        run: uv build --wheel
      - name: Instalar el paquete y probar CLI, Chromium y MCP
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/mcp-moodle/tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/mcp-moodle/bin
        run: uv run python scripts/ci_verify_install.py

  arch:
    name: Arch Linux
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base
      options: --shm-size=1g
    timeout-minutes: 20
    steps:
      - name: Preparar Arch y bibliotecas de Chromium
        run: pacman -Syu --noconfirm --needed git uv chromium
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Instalar Python y dependencias
        run: uv sync --locked --python 3.13
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-arch-${{ hashFiles('uv.lock') }}
      - name: Preparar Chromium de Playwright
        run: uv run playwright install chromium
      - name: Construir paquete
        run: uv build --wheel
      - name: Instalar el paquete y probar CLI, Chromium y MCP
        run: uv run python scripts/ci_verify_install.py

  macos:
    name: macOS 15 (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
            artifact: mcp-moodle-macos-arm64
          - runner: macos-15-intel
            architecture: x86_64
            artifact: mcp-moodle-macos-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Instalar dependencias
        run: uv sync --locked --python 3.13
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.architecture }}-${{ hashFiles('uv.lock') }}
      - name: Comprobar arquitectura nativa
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: uv run python -c "import os, platform; assert platform.machine() == os.environ['EXPECTED_ARCHITECTURE'], platform.machine()"
      - name: Preparar Chromium en macOS
        run: uv run playwright install chromium
      - name: Construir paquete
        run: uv build --wheel
      - name: Instalar el paquete y probar CLI, Chromium y MCP
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/mcp-moodle/tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/mcp-moodle/bin
        run: uv run python scripts/ci_verify_install.py
