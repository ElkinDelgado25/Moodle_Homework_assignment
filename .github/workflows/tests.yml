name: Build y pruebas multiplataforma

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Ubuntu 24.04 (Debian)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: uv sync --locked --python 3.11
      - name: Preparar Chromium y bibliotecas de Ubuntu
        run: uv run playwright install --with-deps chromium
      - name: Construir paquete
        run: uv build --wheel
      - name: Instalar el paquete y probar CLI, Chromium y MCP
        run: uv run python scripts/ci_verify_install.py
      - name: Guardar instalador verificado
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-moodle-ubuntu
          path: dist/mcp-moodle-installer-0.1.0.zip
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows Server 2025 (x64)
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
      UV_PYTHON_ARCH: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: uv sync --locked --python 3.11
      - name: Preparar Chromium en Windows
        run: uv run playwright install chromium
      - name: Construir paquete
        run: uv build --wheel
      - name: Instalar el paquete y probar CLI, Chromium y MCP
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/mcp-moodle/tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/mcp-moodle/bin
        run: uv run python scripts/ci_verify_install.py
      - name: Guardar instalador verificado
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-moodle-windows
          path: dist/mcp-moodle-installer-0.1.0.zip
          if-no-files-found: error
          retention-days: 14

  arch:
    name: Arch Linux
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base
      options: --shm-size=1g
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Preparar Arch y bibliotecas de Chromium
        run: pacman -Syu --noconfirm --needed git uv chromium
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Instalar Python y dependencias
        run: uv sync --locked --python 3.11
      - name: Preparar Chromium de Playwright
        run: uv run playwright install chromium
      - name: Construir paquete
        run: uv build --wheel
      - name: Instalar el paquete y probar CLI, Chromium y MCP
        run: uv run python scripts/ci_verify_install.py
      - name: Guardar instalador verificado
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-moodle-arch
          path: dist/mcp-moodle-installer-0.1.0.zip
          if-no-files-found: error
          retention-days: 14
