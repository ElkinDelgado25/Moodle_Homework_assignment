name: Build y pruebas multiplataforma

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Ubuntu 24.04 (Debian)
            runner: ubuntu-24.04
            artifact: ubuntu
            python: "3.11"
          - platform: Windows 11 (ARM64, Python x64)
            runner: windows-11-arm
            artifact: windows
            python: cpython-3.11-windows-x86_64-none
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      UV_PYTHON_ARCH: x86_64
    steps:
      - name: Confirmar Windows 11 de escritorio
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $system = Get-CimInstance Win32_OperatingSystem
          $system | Select-Object Caption, Version, OSArchitecture, ProductType | Format-List
          if ($system.ProductType -ne 1 -or $system.Caption -notmatch 'Windows 11') {
            throw "Este check requiere Windows 11 de escritorio."
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar dependencias
        run: uv sync --locked --python ${{ matrix.python }}
      - name: Preparar Chromium y bibliotecas de Ubuntu
        if: runner.os == 'Linux'
        run: uv run playwright install --with-deps chromium
      - name: Preparar Chromium en Windows
        if: runner.os == 'Windows'
        run: uv run playwright install chromium
      - name: Construir paquete
        run: uv build --wheel
      - name: Instalar el paquete y probar CLI, Chromium y MCP
        run: uv run python scripts/ci_verify_install.py
      - name: Guardar instalador verificado
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-moodle-${{ matrix.artifact }}
          path: dist/mcp-moodle-installer-0.1.0.zip
          if-no-files-found: error
          retention-days: 14

  arch:
    name: Arch Linux
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base
      options: --shm-size=1g
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Preparar Arch y bibliotecas de Chromium
        run: pacman -Syu --noconfirm --needed git uv chromium
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Instalar Python y dependencias
        run: uv sync --locked --python 3.11
      - name: Preparar Chromium de Playwright
        run: uv run playwright install chromium
      - name: Construir paquete
        run: uv build --wheel
      - name: Instalar el paquete y probar CLI, Chromium y MCP
        run: uv run python scripts/ci_verify_install.py
      - name: Guardar instalador verificado
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-moodle-arch
          path: dist/mcp-moodle-installer-0.1.0.zip
          if-no-files-found: error
          retention-days: 14
