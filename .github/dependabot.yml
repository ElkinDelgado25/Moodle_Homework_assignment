version: 2

updates:
  # Dependencias Python declaradas en pyproject.toml y fijadas en uv.lock.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Guayaquil"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      python-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Las actualizaciones mayores se revisan a mano: pueden exigir cambios de API.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Acciones usadas en .github/workflows/tests.yml.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Guayaquil"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
    groups:
      github-actions:
        patterns: ["*"]
